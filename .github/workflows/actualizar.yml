name: Actualizar estado del arte

on:
  schedule:
    - cron: "17 5 * * 1"     # cada lunes a las 05:17 UTC (cámbialo a tu gusto)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write             # para poder hacer commit de los datos nuevos

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Consultar plataformas
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python collect.py

      # Se ejecuta aunque alguna plataforma falle, para no perder lo que sí se obtuvo.
      # El workflow quedará en rojo y GitHub te enviará un correo.
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%F)"
          git push
